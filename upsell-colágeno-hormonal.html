<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Protocolo Colágeno Hormonal — Oferta Especial</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #faf9f7;
      color: #1a1a1a;
      min-height: 100vh;
    }

    /* ─── 1. BANNER DE ALERTA ─────────────────────────────── */
    .alert-banner {
      background-color: #cc0000;
      color: #ffffff;
      text-align: center;
      padding: 14px 20px;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      line-height: 1.5;
      text-transform: uppercase;
    }

    /* ─── CONTAINER PRINCIPAL ─────────────────────────────── */
    .page-wrapper {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 16px 48px;
    }

    /* ─── 2. CHAMADA PARA A VSL ───────────────────────────── */
    .vsl-headline {
      text-align: center;
      padding: 32px 8px 24px;
    }

    .vsl-headline .line-normal {
      display: block;
      font-size: 1.6rem;
      font-weight: 800;
      color: #1a1a1a;
      line-height: 1.2;
    }

    .vsl-headline .line-highlight {
      display: inline;
      font-size: 2.4rem;
      font-weight: 900;
      color: #c8980a;
      line-height: 1.1;
    }

    .vsl-headline .line-punctuation {
      display: inline;
      font-size: 2.4rem;
      font-weight: 900;
      color: #1a1a1a;
      line-height: 1.1;
    }

    .vsl-headline .arrow-down {
      display: block;
      font-size: 2rem;
      margin-top: 12px;
      line-height: 1;
    }

    /* ─── 3. PLACEHOLDER DO VÍDEO ─────────────────────────── */
    .video-section {
      width: 100%;
      margin-bottom: 28px;
    }

    /* container 16:9 responsivo */
    .video-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 9/16 × 100 */
      background-color: #1a1a1a;
      border-radius: 6px;
      overflow: hidden;
    }

    /* O iframe/vídeo deve receber position:absolute; top:0; left:0; width:100%; height:100% */
    .video-wrapper iframe,
    .video-wrapper video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Placeholder visual — remover quando colar o embed real */
    .video-placeholder-label {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #666;
      font-size: 0.85rem;
      text-align: center;
      pointer-events: none;
      user-select: none;
    }

    /* ─── 4. BOTÃO DA KIWIFY ──────────────────────────────── */
    .cta-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
    }

    .kiwify-button-container {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    /* ─── 5. LINK "NO, GRACIAS" ───────────────────────────── */
    .decline-section {
      text-align: center;
      padding-top: 8px;
    }

    .decline-link {
      font-size: 0.78rem;
      color: #888;
      text-decoration: underline;
      cursor: pointer;
      background: none;
      border: none;
      padding: 4px;
    }

    .decline-link:hover {
      color: #555;
    }

    /* ─── RESPONSIVO DESKTOP ──────────────────────────────── */
    @media (min-width: 540px) {
      .alert-banner {
        font-size: 0.88rem;
      }

      .vsl-headline .line-normal {
        font-size: 2rem;
      }

      .vsl-headline .line-highlight,
      .vsl-headline .line-punctuation {
        font-size: 3rem;
      }
    }
  </style>
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════
       1. BANNER DE ALERTA
  ════════════════════════════════════════════════════════ -->
  <div class="alert-banner">
    NO SALGAS DE ESTA PÁGINA — ESTAMOS CREANDO TU ACCESO.<br />
    CERRARLA AHORA PODRÍA GENERAR ERRORES EN TU PEDIDO.
  </div>

  <div class="page-wrapper">

    <!-- ═══════════════════════════════════════════════════
         2. CHAMADA PARA A VSL
    ════════════════════════════════════════════════════ -->
    <div class="vsl-headline">
      <span class="line-normal">¡Mira abajo tu</span>
      <div>
        <span class="line-highlight">PRIMERA CLASE</span><span class="line-punctuation">!</span>
      </div>
      <span class="arrow-down">👇</span>
    </div>

    <!-- ═══════════════════════════════════════════════════
         3. ESPAÇO PARA O VÍDEO (VSL)
         Para inserir o vídeo, cole o <iframe> ou <video>
         dentro de .video-wrapper e remova o placeholder.
         O elemento deve ter:
           position: absolute; top: 0; left: 0;
           width: 100%; height: 100%; border: none;
    ════════════════════════════════════════════════════ -->
    <div class="video-section">
      <div class="video-wrapper">

        <!-- COLAR AQUI O EMBED DO VÍDEO (iframe Vimeo / YouTube / player próprio) -->
        <!-- Exemplo Vimeo:
        <iframe
          src="https://player.vimeo.com/video/SEU_ID?autoplay=1&title=0&byline=0&portrait=0"
          allow="autoplay; fullscreen; picture-in-picture"
          allowfullscreen
          style="position:absolute;top:0;left:0;width:100%;height:100%;border:none;">
        </iframe>
        -->

        <!-- Placeholder visual — apagar quando colar o embed -->
        <div class="video-placeholder-label">[ Espaço reservado para o vídeo ]</div>

      </div>
    </div>

    <!-- ═══════════════════════════════════════════════════
         4. BOTÃO DA KIWIFY (1-click upsell)
    ════════════════════════════════════════════════════ -->
    <div class="cta-section">
      <div class="kiwify-button-container">

        <!-- COLAR AQUI O HTML DO BOTÃO DA KIWIFY -->

      </div>
    </div>

    <!-- ═══════════════════════════════════════════════════
         5. LINK "NO, GRACIAS"
         Substitua href="#" pela URL de recusa da Kiwify
         (normalmente fornecida no painel de upsell).
    ════════════════════════════════════════════════════ -->
    <div class="decline-section">
      <a class="decline-link" href="#">
        No, gracias. No quiero el Protocolo Colágeno Hormonal.
      </a>
    </div>

  </div><!-- /page-wrapper -->

</body>
</html>
